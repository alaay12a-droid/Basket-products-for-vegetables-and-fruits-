openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard-auth
    description: Dashboard authentication
  - name: orders
    description: Order management
  - name: revenue
    description: Revenue and analytics
  - name: menu
    description: Menu management
  - name: drivers
    description: Driver management

paths:
  /merchant/status:
    get:
      operationId: merchantStatus
      tags: [merchant]
      responses:
        "200":
          description: Independent merchant service readiness, without accessing customer data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantReadiness" }
  /merchant/login:
    post:
      operationId: merchantLogin
      tags: [merchant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardCredentials" }
      responses:
        "200":
          description: Independent merchant session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantSession" }
  /merchant/logout:
    post:
      operationId: merchantLogout
      tags: [merchant]
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /merchant/state:
    get:
      operationId: merchantState
      tags: [merchant]
      responses:
        "200":
          description: Authorized branch-scoped merchant snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantSnapshot" }
        "401": { description: Merchant login required }
        "503": { description: Merchant service not activated or schema not installed }
  /merchant/history:
    get:
      operationId: merchantHistory
      tags: [merchant]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string, enum: [pending, preparing, ready, done, cancelled] } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Server-filtered archive page, up to 250 orders, with branch-scoped detail data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MerchantSnapshot" }
        "401": { description: Merchant login required }
  /merchant/actions:
    post:
      operationId: merchantAction
      tags: [merchant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MerchantCommand" }
      responses:
        "200":
          description: Persisted command result; refresh state after success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "409": { description: State conflict; reload before retrying }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /settings/menu-template:
    get:
      operationId: getMenuTemplate
      tags: [menu]
      summary: Get the active customer menu template
      responses:
        "200":
          description: Current menu template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuTemplateSetting"
    put:
      operationId: updateMenuTemplate
      tags: [menu]
      summary: Update the active customer menu template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuTemplateSetting"
      responses:
        "200":
          description: Menu template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuTemplateSetting"

  # ── Dashboard Auth ───────────────────────────────────────────────────
  /dashboard/auth/login:
    post:
      operationId: dashboardLogin
      tags: [dashboard-auth]
      summary: Login to dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUser"
        "401":
          description: Invalid credentials

  /dashboard/auth/me:
    get:
      operationId: dashboardMe
      tags: [dashboard-auth]
      summary: Get current dashboard user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUser"
        "401":
          description: Not authenticated

  /dashboard/auth/logout:
    post:
      operationId: dashboardLogout
      tags: [dashboard-auth]
      summary: Logout from dashboard
      responses:
        "200":
          description: Logged out

  # ── Orders ───────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, preparing, ready, done, cancelled]
        - name: phone
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/status:
    patch:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  # ── Revenue / KPIs ───────────────────────────────────────────────────
  /revenue:
    get:
      operationId: getRevenue
      tags: [revenue]
      summary: Get revenue summary (today)
      responses:
        "200":
          description: Revenue data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueData"

  /revenue/live:
    get:
      operationId: getLiveRevenue
      tags: [revenue]
      summary: Live revenue stats (last hour, last 30 min, today extras)
      responses:
        "200":
          description: Live revenue data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveRevenueData"

  /revenue/range:
    get:
      operationId: getRevenueRange
      tags: [revenue]
      summary: Get revenue for a date range
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
        - name: to
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revenue data for range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueData"

  # ── Menu ─────────────────────────────────────────────────────────────
  /menu-categories/{categoryId}:
    delete:
      operationId: deleteMenuCategory
      tags: [menu]
      summary: Delete an empty menu category without deleting products
      parameters:
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Remaining categories in their saved order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuCategory"
        "401":
          description: Dashboard session required
        "404":
          description: Category not found
        "409":
          description: Category still contains products and cannot be deleted

  /menu:
    get:
      operationId: listMenuItems
      tags: [menu]
      summary: List all menu items
      responses:
        "200":
          description: Menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MenuItem"

  /menu/{itemId}:
    put:
      operationId: updateMenuItem
      tags: [menu]
      summary: Update menu item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MenuItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuItem"
    delete:
      operationId: deleteMenuItem
      tags: [menu]
      summary: Delete menu item
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted

  # ── Drivers ──────────────────────────────────────────────────────────
  /drivers:
    get:
      operationId: listDrivers
      tags: [drivers]
      summary: List all drivers
      responses:
        "200":
          description: Drivers list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Driver"

  /drivers/daily-summaries:
    get:
      operationId: getDriverDailySummaries
      tags: [drivers]
      summary: Get daily summaries for all drivers
      responses:
        "200":
          description: Daily summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DriverDailySummary"

  # ── Ratings ───────────────────────────────────────────────────────────
  /orders/{id}/driver-rating:
    post:
      operationId: submitDriverRating
      tags: [ratings]
      summary: Submit a driver rating after delivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverRatingInput"
      responses:
        "200":
          description: Rating saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  stars:
                    type: integer
        "400":
          description: Invalid rating
        "404":
          description: Assignment not found

  /ratings/drivers:
    get:
      operationId: getDriverRankings
      tags: [ratings]
      summary: Get all drivers ranked by average rating
      responses:
        "200":
          description: Driver rankings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DriverRankingEntry"

components:
  schemas:
    MerchantReadiness:
      type: object
      required: [enabled, message, printerNote]
      properties:
        enabled: { type: boolean }
        message: { type: string }
        printerNote: { type: string }
    MerchantSession:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/DashboardUser" }
        token: { type: string }
    MerchantCommand:
      type: object
      required: [kind, data, requestId]
      properties:
        kind:
          type: string
          enum: [accept, reject, ready, deliver, refund-create, refund-decide, driver-save, assign-driver, message-send, message-read, item-save, item-delete, item-availability, category-save, category-delete, category-availability, menu-reorder, hours-save, store-toggle, notification-read, settings-save]
        id: { type: string }
        requestId: { type: string, format: uuid }
        data:
          type: object
          additionalProperties: true
    MerchantOrder:
      allOf:
        - { $ref: "#/components/schemas/Order" }
        - type: object
          properties:
            branchId: { type: ["integer", "null"] }
            branchName: { type: ["string", "null"] }
            driverId: { type: ["integer", "null"] }
            driverName: { type: ["string", "null"] }
            preparationMinutes: { type: ["integer", "null"] }
            rejectionReason: { type: ["string", "null"] }
            taxAmount: { type: number }
    MerchantProduct:
      allOf:
        - { $ref: "#/components/schemas/MenuItem" }
        - type: object
          properties:
            unavailableUntil: { type: ["string", "null"] }
            options:
              type: array
              items:
                type: object
                required: [groupName, required, choices]
                properties:
                  groupName: { type: string }
                  required: { type: boolean }
                  choices:
                    type: array
                    items:
                      type: object
                      required: [name, extraPrice, available]
                      properties:
                        name: { type: string }
                        extraPrice: { type: number }
                        available: { type: boolean }
    MerchantMessage:
      type: object
      required: [id, orderId, text, fromCashier, createdAt]
      properties:
        id: { type: integer }
        orderId: { type: integer }
        text: { type: string }
        fromCashier: { type: boolean }
        createdAt: { type: string }
        readAt: { type: ["string", "null"] }
    MerchantNotification:
      type: object
      required: [id, type, title, body, createdAt]
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        orderId: { type: ["integer", "null"] }
        createdAt: { type: string }
        readAt: { type: ["string", "null"] }
    MerchantRefund:
      type: object
      required: [id, orderId, reason, type, status, createdAt]
      properties:
        id: { type: integer }
        orderId: { type: integer }
        reason: { type: string }
        type: { type: string, enum: [cancel, refund] }
        status: { type: string, enum: [pending, accepted, rejected] }
        createdAt: { type: string }
        decisionReason: { type: ["string", "null"] }
    MerchantAssignment:
      type: object
      required: [id, orderId, driverId, driverName, createdAt]
      properties:
        id: { type: integer }
        orderId: { type: integer }
        driverId: { type: integer }
        driverName: { type: string }
        previousDriverId: { type: ["integer", "null"] }
        createdAt: { type: string }
    MerchantDayHours:
      type: object
      required: [day, periods]
      properties:
        day: { type: integer, minimum: 0, maximum: 6 }
        periods:
          type: array
          items:
            type: object
            required: [open, close]
            properties:
              open: { type: string }
              close: { type: string }
    MerchantSettings:
      type: object
      required: [storeName, supportPhone, supportWhatsapp, paperWidth, copies, kitchenCopy, autoPrint, soundEnabled, keepAwake, language, printerTransport, printerAddress]
      properties:
        storeName: { type: string }
        storeAddress: { type: string }
        taxNumber: { type: string }
        supportPhone: { type: string }
        supportWhatsapp: { type: string }
        paperWidth: { type: integer, enum: [58, 80] }
        copies: { type: integer, minimum: 1, maximum: 5 }
        kitchenCopy: { type: boolean }
        autoPrint: { type: boolean }
        soundEnabled: { type: boolean }
        keepAwake: { type: boolean }
        language: { type: string, enum: [ar, en] }
        printerTransport: { type: string, enum: [none, tcp, bluetooth, sunmi, vendor] }
        printerAddress: { type: string }
    MerchantSnapshot:
      type: object
      required: [user, orders, products, categories, drivers, messages, notifications, refunds, assignmentHistory, hours, settings, storeOpen, serverTime]
      properties:
        user: { $ref: "#/components/schemas/DashboardUser" }
        orders:
          type: array
          items: { $ref: "#/components/schemas/MerchantOrder" }
        products:
          type: array
          items: { $ref: "#/components/schemas/MerchantProduct" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/MenuCategory" }
        drivers:
          type: array
          items: { $ref: "#/components/schemas/Driver" }
        messages:
          type: array
          items: { $ref: "#/components/schemas/MerchantMessage" }
        notifications:
          type: array
          items: { $ref: "#/components/schemas/MerchantNotification" }
        refunds:
          type: array
          items: { $ref: "#/components/schemas/MerchantRefund" }
        assignmentHistory:
          type: array
          items: { $ref: "#/components/schemas/MerchantAssignment" }
        hours:
          type: array
          items: { $ref: "#/components/schemas/MerchantDayHours" }
        settings: { $ref: "#/components/schemas/MerchantSettings" }
        storeOpen: { type: boolean }
        closedUntil: { type: ["string", "null"] }
        serverTime: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ── Auth ──────────────────────────────────────────────────────────
    DashboardCredentials:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    DashboardUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [admin, employee]
      required: [id, username, role]

    # ── Orders ────────────────────────────────────────────────────────
    OrderItemSelectedOption:
      type: object
      properties:
        groupName:
          type: string
        choice:
          type: string
      required: [groupName, choice]

    OrderItemCustomization:
      type: object
      properties:
        size:
          type: string
        riceType:
          type: string
        addon:
          type: string
        variantId:
          type: string
        variantName:
          type: string
        variantPrice:
          type: number
        unitPrice:
          type: number
        selectedOptions:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemSelectedOption"

    OrderItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: integer
        quantity:
          type: integer
        customization:
          $ref: "#/components/schemas/OrderItemCustomization"
      required: [id, name, price, quantity]

    Order:
      type: object
      properties:
        id:
          type: integer
        dailyNumber:
          type: integer
        customerName:
          type: string
        customerPhone:
          type: string
        customerAddress:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        totalPrice:
          type: integer
        deliveryFee:
          type: integer
        discountCode:
          type: string
          nullable: true
        discountAmount:
          type: integer
          nullable: true
        orderType:
          type: string
          enum: [delivery, pickup]
        status:
          type: string
          enum: [pending, preparing, ready, done, cancelled]
        paymentMethod:
          type: string
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - dailyNumber
        - customerName
        - customerPhone
        - customerAddress
        - items
        - totalPrice
        - deliveryFee
        - orderType
        - status
        - paymentMethod
        - createdAt

    OrderStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, preparing, ready, done, cancelled]
      required: [status]

    # ── Revenue ───────────────────────────────────────────────────────
    RevenueAggregate:
      type: object
      properties:
        totalRevenue:    { type: number }
        deliveryRevenue: { type: number }
        itemsRevenue:    { type: number }
        orderCount:      { type: integer }
        taxAmount:       { type: number }
        netRevenue:      { type: number }
        cancelledCount:  { type: integer }
        cancelledValue:  { type: number }
        pendingCount:    { type: integer }
        cashCount:       { type: integer }
        onlineCount:     { type: integer }
        cashRevenue:     { type: number }
        onlineRevenue:   { type: number }
      required: [totalRevenue, deliveryRevenue, itemsRevenue, orderCount, taxAmount,
                 netRevenue, cancelledCount, cancelledValue, pendingCount,
                 cashCount, onlineCount, cashRevenue, onlineRevenue]

    DailyBreakdown:
      type: object
      properties:
        date:           { type: string }
        total:          { type: number }
        delivery:       { type: number }
        items:          { type: number }
        orders:         { type: integer }
        tax:            { type: number }
        net:            { type: number }
        cancelledCount: { type: integer }
        cancelledValue: { type: number }
        cashCount:      { type: integer }
        onlineCount:    { type: integer }
      required: [date, total, delivery, items, orders, tax, net,
                 cancelledCount, cancelledValue, cashCount, onlineCount]

    MonthlyBreakdown:
      type: object
      properties:
        month:          { type: string }
        total:          { type: number }
        delivery:       { type: number }
        items:          { type: number }
        orders:         { type: integer }
        tax:            { type: number }
        net:            { type: number }
        cancelledCount: { type: integer }
        cancelledValue: { type: number }
        cashCount:      { type: integer }
        onlineCount:    { type: integer }
      required: [month, total, delivery, items, orders, tax, net,
                 cancelledCount, cancelledValue, cashCount, onlineCount]

    TopItem:
      type: object
      properties:
        id:      { type: string }
        name:    { type: string }
        qty:     { type: integer }
        revenue: { type: number }
      required: [id, name, qty, revenue]

    LiveRevenueData:
      type: object
      properties:
        lastHour:            { $ref: "#/components/schemas/RevenueAggregate" }
        last30min:           { $ref: "#/components/schemas/RevenueAggregate" }
        uniqueCustomerCount: { type: integer }
        totalItemsSold:      { type: integer }
        totalDiscounts:      { type: number }
      required: [lastHour, last30min, uniqueCustomerCount, totalItemsSold, totalDiscounts]

    RevenueData:
      type: object
      properties:
        today:            { $ref: "#/components/schemas/RevenueAggregate" }
        week:             { $ref: "#/components/schemas/RevenueAggregate" }
        month:            { $ref: "#/components/schemas/RevenueAggregate" }
        year:             { $ref: "#/components/schemas/RevenueAggregate" }
        dailyBreakdown:
          type: array
          items: { $ref: "#/components/schemas/DailyBreakdown" }
        monthlyBreakdown:
          type: array
          items: { $ref: "#/components/schemas/MonthlyBreakdown" }
        topItems:
          type: array
          items: { $ref: "#/components/schemas/TopItem" }
      required: [today, week, month, year, dailyBreakdown, monthlyBreakdown, topItems]

    # ── Menu ──────────────────────────────────────────────────────────
    MenuTemplateSetting:
      type: object
      properties:
        menuTemplate:
          type: string
          enum: [classic, modern]
          default: classic
      required: [menuTemplate]

    SizeOption:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        enabled:
          type: boolean
      required: [name, price, enabled]

    MenuCategory:
      type: object
      required: [id, name, nameEn, icon]
      properties:
        id:
          type: string
        name:
          type: string
        nameEn:
          type: string
        icon:
          type: string
        isCustom:
          type: boolean

    MenuItem:
      type: object
      properties:
        id:
          type: integer
        itemId:
          type: string
        name:
          type: string
        nameEn:
          type: string
          nullable: true
        category:
          type: string
        price:
          type: integer
        available:
          type: boolean
        imageKey:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        stock:
          type: integer
          nullable: true
        sizes:
          type: array
          items:
            $ref: "#/components/schemas/SizeOption"
        sortOrder:
          type: integer
      required: [id, itemId, name, category, price, available, sizes, sortOrder]

    MenuItemUpdate:
      type: object
      properties:
        name:
          type: string
        nameEn:
          type: string
        price:
          type: integer
        available:
          type: boolean
        stock:
          type: integer
          nullable: true
        imageUrl:
          type: string
          nullable: true
        imageKey:
          type: string
          nullable: true
        sizes:
          type: array
          items:
            $ref: "#/components/schemas/SizeOption"

    # ── Drivers ───────────────────────────────────────────────────────
    Driver:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        active:
          type: boolean
        photoUrl:
          type: string
          nullable: true
      required: [id, name, phone, active]

    DriverDailySummary:
      type: object
      properties:
        driverId:
          type: integer
        name:
          type: string
        orderCount:
          type: integer
        cashTotal:
          type: integer
        electronicTotal:
          type: integer
      required: [driverId, name, orderCount, cashTotal, electronicTotal]

    DriverRatingInput:
      type: object
      properties:
        stars:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
      required: [stars]

    DriverReview:
      type: object
      properties:
        orderId:
          type: integer
        stars:
          type: integer
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [orderId, stars]

    DriverRankingEntry:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        photoUrl:
          type: string
          nullable: true
        active:
          type: boolean
        completedDeliveries:
          type: integer
        totalRatings:
          type: integer
        avgStars:
          type: number
          nullable: true
        recentReviews:
          type: array
          items:
            $ref: "#/components/schemas/DriverReview"
      required: [id, name, phone, active, completedDeliveries, totalRatings, recentReviews]
